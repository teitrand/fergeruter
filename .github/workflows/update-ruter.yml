name: Oppdater rutetabell

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_ruter.py"
      - ".github/workflows/update-ruter.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent rutetabell frå Entur
        run: python scripts/fetch_ruter.py
      - name: Commit berre ved endring i tabellen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ruter.json
          if git diff --staged --quiet; then
            echo "Rutetabellen er uendra"
          else
            git commit -m "data: oppdater rutetabell 1136"
            git push
          fi
