name: Oppdater rutetabell

# Kvar natt, så activeDates ikkje går ut i stillhet.
# Fila blir berre commita når innhaldet faktisk er endra.
# Schedule køyrer på standardgreina (main). workflow_dispatch verkar òg frå dev.
# Push går gjennom scripts/commit_on_main.py, same retry som dei andre datajobbane.
on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Last ned og commit berre ved endring
        run: |
          python scripts/commit_on_main.py \
            --message "data: oppdater rutetabell 1136" \
            --refresh "python scripts/fetch_ruter.py && python scripts/fetch_korrespondanse.py" \
            -- data/ruter.json data/korrespondanse.json
