name: Publiser testhost til /dev/

# GitHub Pages kjem framleis frå `main` (legacy). Testhosten må derfor
# liggje som mappa `dev/` på main inntil Pages-kjelda er bytt til Actions.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev-folder
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: dest
          fetch-depth: 0
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kopier testhost og commit til main
        run: |
          python src/scripts/commit_on_main.py \
            --repo dest \
            --to main \
            --message "data: oppdater testhost /dev/" \
            --refresh "rm -rf dev && mkdir -p dev && rsync -a --exclude '.git' --exclude '.github' --exclude 'dev' ../src/ dev/" \
            -- dev
