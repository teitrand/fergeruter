name: Publiser testhost til /dev/

# GitHub Pages kjem framleis frå `main` (legacy). Testhosten må derfor
# liggje som mappa `dev/` på main inntil Pages-kjelda er bytt til Actions.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev-folder
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: dest
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: src
      - name: Kopier testhost inn i /dev/
        run: |
          rm -rf dest/dev
          mkdir -p dest/dev
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dev' src/ dest/dev/
      - name: Commit til main
        working-directory: dest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev
          if git diff --staged --quiet; then
            echo "Testhosten er uendra"
          else
            git commit -m "data: oppdater testhost /dev/"
            git push origin HEAD:main
          fi
