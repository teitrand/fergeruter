name: Logg signalturar

# Cloudflare-workeren i cloudflare/signaltur-cron/ er klokka. Ho startar
# denne jobben med workflow_dispatch på :07 og :37 UTC mellom 04 og 21.
# Ikkje 22:07 UTC: det er 00:07 i Oslo i sommartid og loggar ein tom ny dag.
# Siste slag 21:37 UTC er 23:37 sommertid og 22:37 vintertid.
# Cron her er reserve med same minutta, om workeren er nede.
#
# concurrency held éin køyring om gongen. Er loggen skriven dei siste
# 20 minutta, hoppar jobben over, så reserve og worker ikkje skriv dobbelt.
#
# Start: når denne fila ligg på main, deploy workeren. Sjå
# cloudflare/signaltur-cron/README.md.
# Stopp: slå av cron på workeren og slå av denne workflowen.

on:
  schedule:
    - cron: "7,37 4-21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Logg sjølv om fila nyleg er skriven."
        required: false
        default: false
        type: boolean

concurrency:
  group: log-signalturar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Logg signalturar
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python -u scripts/signaltur_loop.py
