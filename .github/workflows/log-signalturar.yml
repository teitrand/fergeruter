name: Logg signalturar

on:
  schedule:
    # Annankvar halvtime gjennom driftsdøgnet. Entur har berre dagen i dag,
    # så statusen må skrivast ned før avlysinga dett ut av feeden.
    - cron: "*/30 4-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Les førre oppdatering
        run: |
          python -c "import json, pathlib; p = pathlib.Path('data/signalturar.json'); print((json.loads(p.read_text()).get('updatedAt') or '') if p.exists() else '')" > /tmp/signal-log-prev.txt
      - name: Skriv signaltur-loggen
        run: python scripts/log_signalturar.py
      - name: Commit dersom noko er endra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signalturar.json
          if git diff --staged --quiet; then
            echo "Ingen endringar"
          else
            git commit -m "data: logg signalturar"
            git push
          fi
      - name: Feil om førre køyring ikkje var i tide
        run: python scripts/log_signalturar.py --require-recent "$(cat /tmp/signal-log-prev.txt)"
