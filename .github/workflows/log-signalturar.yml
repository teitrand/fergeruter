name: Logg signalturar

# Éi køyring loggar gjennom vaktvindauget og startar seg sjølv på nytt før
# GitHub sitt 6-timarstak. Cron er vakt: ho startar ei ny løkke om ingen
# køyring er aktiv (in_progress eller i kø).
#
# :07 og :37, ikkje :00/:30. GitHub si cron-kø er tettast på heile og halve
# timar, så vakta treffer oftare utanfor det.
#
# Start, etter at denne fila ligg på main: Actions → Logg signalturar →
# Run workflow, grein main, éin gong. La vidareførings-flagget stå av.
# Stopp: avbryt den køyrande jobben og slå av workflowen, elles vekker
# vakta ho att.

on:
  schedule:
    # Vakt gjennom vindauget 04:00–22:40 UTC. Siste slag er 22:37.
    - cron: "7,37 4-22 * * *"
  workflow_dispatch:
    inputs:
      handoff:
        description: "Sett av løkka sjølv ved vidareførings. La stå av ved manuell start."
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  log:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Logg i løkke
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          HANDOFF: ${{ github.event.inputs.handoff }}
        run: python -u scripts/signaltur_loop.py
