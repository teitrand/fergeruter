name: Oppdater trafikkmeldingar

# Push går gjennom scripts/commit_on_main.py, same retry som dei andre datajobbane.
on:
  schedule:
    # Reserve for data/trafikkmeldinger.json. GitHub køyrer sjeldan */5.
    # Fersk veg for nettlesaren er Cloudflare-workeren
    # cloudflare/trafikkmeldinger/ (CORS-JSON). Ho startar ikkje denne jobben.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_trafikkmeldinger.py"
      - ".github/workflows/update-trafikkmeldinger.yml"

concurrency:
  group: update-trafikkmeldinger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full historie, så ein avvist push kan rebasast på siste main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent og commit dersom noko er endra
        run: |
          python scripts/commit_on_main.py \
            --message "data: oppdater Fjord1-trafikkmeldingar" \
            --refresh "python scripts/fetch_trafikkmeldinger.py" \
            -- data/trafikkmeldinger.json
